<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parvez | E-Z.bio Style</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden; /* Prevent scrolling */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ========================================
           1. TERMINAL PRELOADER (Black Screen)
           ======================================== */
        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050505;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out;
        }

        .terminal-window {
            width: 90%;
            max-width: 500px;
            background: #111;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
            transform: scale(0.7);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease-out;
        }

        .terminal-window.show-terminal {
            transform: scale(1);
            opacity: 1;
        }

        .terminal-header {
            background: #222;
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .mac-dot { width: 12px; height: 12px; border-radius: 50%; }
        .mac-dot.red { background-color: #ff5f56; }
        .mac-dot.yellow { background-color: #ffbd2e; }
        .mac-dot.green { background-color: #27c93f; }

        .terminal-body {
            padding: 20px;
            min-height: 200px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #00ff41;
            line-height: 1.8;
            white-space: pre-wrap; 
        }

        /* ========================================
           2. MAIN WEBSITE (E-Z.BIO THEME)
           ======================================== */
        #main-content {
            display: none;
            opacity: 0;
            width: 100%;
            height: 100%;
            position: relative;
            transition: opacity 1.5s ease-in;
        }

        /* Background Video */
        .bg-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.5) blur(3px); 
        }

        /* The Main Glass Card */
        .glass-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            height: 85vh;
            margin: auto;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .glass-container::-webkit-scrollbar { display: none; }
        .glass-container { -ms-overflow-style: none; scrollbar-width: none; }

        .views-count {
            align-self: flex-start;
            font-size: 13px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .profile-pic {
            width: 100px; height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .name {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .diamond-icon { color: #d8b4fe; font-size: 18px; margin-bottom: 5px; }

        .bio-text {
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        /* Small Social Icons */
        .small-socials {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .small-socials a {
            color: #fff;
            font-size: 22px;
            text-decoration: none;
            transition: 0.3s;
        }
        .small-socials a:hover { transform: scale(1.15); text-shadow: 0 0 15px #fff; }

        /* Channel Cards */
        .channel-card {
            width: 100%;
            background: linear-gradient(135deg, rgba(76, 29, 149, 0.6), rgba(124, 58, 237, 0.4));
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s;
        }

        .channel-card:hover {
            transform: scale(1.02);
        }

        .channel-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .channel-header img { 
            width: 50px; height: 50px; 
            border-radius: 50%; 
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .channel-info h4 { 
            font-size: 16px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
        }
        
        .channel-info p { font-size: 12px; opacity: 0.7; }
        .badge-verified { color: #a855f7; font-size: 14px; }
        
        .action-btn {
            display: block;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }
        .action-btn:hover { background: rgba(0, 0, 0, 0.8); }

        /* Music Player */
        .music-player {
            width: 100%;
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.6), rgba(126, 34, 206, 0.4));
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 5px;
        }

        .music-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .song-title { font-size: 13px; font-weight: 500; }

        .progress-bar-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            margin-bottom: 15px;
            opacity: 0.8;
        }
        .progress-line {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            position: relative;
        }
        .progress-line::after {
            content: '';
            position: absolute;
            left: 0; top: -2px;
            width: 30%; height: 8px;
            background: #fff;
            border-radius: 5px;
        }

        .music-controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            align-items: center;
        }
        .music-controls #play-btn { font-size: 24px; cursor: pointer; transition: 0.2s; }
        .music-controls #play-btn:hover { transform: scale(1.2); text-shadow: 0 0 10px #fff; }
        .music-controls i:not(#play-btn) { font-size: 18px; opacity: 0.6; }

        /* ========================================
           3. PARTICLE EFFECT (Click Animation)
           ======================================== */
        .sparkle {
            position: absolute;
            width: 6px; height: 6px;
            background-color: #d8b4fe;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px #d8b4fe, 0 0 20px #fff;
            animation: fallAnimation 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fallAnimation {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="preloader">
        <div class="terminal-window" id="term-window">
            <div class="terminal-header">
                <div class="mac-dot red"></div>
                <div class="mac-dot yellow"></div>
                <div class="mac-dot green"></div>
            </div>
            <div class="terminal-body" id="term-text"></div>
        </div>
    </div>

    <div id="main-content">
        
        <video class="bg-video" autoplay loop muted playsinline>
            <source src="bg-video.mp4" type="video/mp4">
        </video>
        
        <div class="glass-container">
            
            <div class="views-count">
                <i class="fas fa-eye"></i> 1337
            </div>

            <img src="profile.jpg" alt="Parvez" class="profile-pic" onerror="this.src='https://i.ibb.co/6wD2t4h/default.jpg'">
            
            <h1 class="name">𝐏ᴀ֟፝ʀᴠᴇ𝐙 모</h1>
            
            <div class="diamond-icon"><i class="far fa-gem"></i></div>
            
            <p class="bio-text">
                Always for her,<br>
                Always with her 🤍
            </p>

            <div class="small-socials">
                <a href="https://discord.com/" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="https://github.com/" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://t.me/Parvezhacker" target="_blank"><i class="fab fa-telegram"></i></a>
            </div>

            <div class="channel-card">
                <div class="channel-header">
                    <img src="tg-pic.jpg" alt="Telegram" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg'">
                    <div class="channel-info">
                        <h4>@all_in_one_63 <i class="fas fa-certificate badge-verified"></i></h4>
                        <p>Main Telegram Channel</p>
                    </div>
                </div>
                <a href="https://t.me/all_in_one_63" target="_blank" class="action-btn">
                    Join Channel &nbsp;<i class="fas fa-arrow-right"></i>
                </a>
            </div>

            <div class="channel-card">
                <div class="channel-header">
                    <img src="fb-pic.jpg" alt="Facebook" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg'">
                    <div class="channel-info">
                        <h4>Parvez Profile <i class="fas fa-certificate badge-verified"></i></h4>
                        <p>Personal Facebook</p>
                    </div>
                </div>
                <a href="https://www.facebook.com/share/1Bj3Q5M2VH/" target="_blank" class="action-btn">
                    Add on Facebook &nbsp;<i class="fas fa-arrow-right"></i>
                </a>
            </div>

            <div class="music-player">
                <div class="music-header">
                    <i class="fas fa-volume-up"></i>
                    <div class="song-title">Surah Al-Mu'minun</div>
                </div>
                
                <div class="progress-bar-container">
                    <span>00:00</span>
                    <div class="progress-line"></div>
                    <span>05:01</span>
                </div>

                <div class="music-controls">
                    <i class="fas fa-step-backward"></i>
                    <i class="fas fa-play" id="play-btn"></i>
                    <i class="fas fa-step-forward"></i>
                </div>
                
                <audio id="bg-audio" loop>
                    <source src="https://server11.mp3quran.net/yasser/023.mp3" type="audio/mpeg">
                </audio>
            </div>

        </div>
    </div>

    <script>
        // --- 1. Terminal Preloader Animation (LIVE FAST TYPING) ---
        const termText = document.getElementById('term-text');
        const termWindow = document.getElementById('term-window');
        
        const commands = [
            "[root@system ~]# ./initialize_profile.sh\n",
            "[*] Loading system components...\n",
            "[*] Connecting to database...\n",
            "[*] Decrypting user credentials...\n",
            "[+] Access Granted. Welcome Parvez."
        ];

        async function liveTypeTerminal() {
            setTimeout(() => {
                termWindow.classList.add('show-terminal');
            }, 100);

            await new Promise(r => setTimeout(r, 600)); 

            for (let i = 0; i < commands.length; i++) {
                let lineText = commands[i];
                let lineSpan = document.createElement('span');
                
                if (i === commands.length - 1) lineSpan.style.color = "#ffd700"; 
                
                termText.appendChild(lineSpan);

                for (let j = 0; j < lineText.length; j++) {
                    lineSpan.innerHTML += lineText.charAt(j);
                    await new Promise(r => setTimeout(r, 15)); 
                }
                
                await new Promise(r => setTimeout(r, 150)); 
            }

            await new Promise(r => setTimeout(r, 600));
            document.getElementById('preloader').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('preloader').style.display = 'none';
                document.body.style.overflow = 'auto';
                const mainContent = document.getElementById('main-content');
                mainContent.style.display = 'flex';
                setTimeout(() => mainContent.style.opacity = '1', 50);
            }, 800);
        }

        window.onload = liveTypeTerminal;

        // --- 2. Music Player Logic ---
        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-btn');
        let isPlaying = false;

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (isPlaying) {
                audio.pause();
                playBtn.className = 'fas fa-play';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    playBtn.className = 'fas fa-pause';
                    isPlaying = true;
                }).catch(err => console.log(err));
            }
        });

        // --- 3. Click Sparkle (Particle) Effect ---
        document.addEventListener('click', function(e) {
            createParticles(e.clientX, e.clientY);
        });

        function createParticles(x, y) {
            const particleCount = 12;
            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement('div');
                particle.className = 'sparkle';
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';

                let angle = Math.random() * Math.PI * 2;
                let distance = Math.random() * 80 + 30; 
                let tx = Math.cos(angle) * distance;
                let ty = Math.sin(angle) * distance + 50; 

                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);

                if (Math.random() > 0.5) {
                    particle.style.backgroundColor = "#fff";
                    particle.style.boxShadow = "0 0 10px #fff";
                }

                document.body.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }
    </script>
</body>
</html>
